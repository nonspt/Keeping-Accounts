<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8ed" />
    <meta name="description" content="简单、清晰、离线可用的个人记账 PWA。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="我的账本" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>我的账本</title>
  </head>
  <body>
    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
      <symbol id="icon-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"/><path d="M9 8h6M9 12h6M9 16h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m7 15 3-4 3 2 4-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="15" r="1.4"/><circle cx="10" cy="11" r="1.4"/><circle cx="13" cy="13" r="1.4"/><circle cx="17" cy="7" r="1.4"/></symbol>
      <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0Z"/></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="icon-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="icon-arrow-right" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="icon-wallet" viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H19a1 1 0 0 1 1 1v15H6.5A2.5 2.5 0 0 1 4 17.5Z"/><path d="M4 7h14a2 2 0 0 1 2 2v2h-5a2 2 0 0 0 0 4h5v5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="15" cy="13" r=".9"/></symbol>
      <symbol id="icon-trend" viewBox="0 0 24 24"><path d="m4 16 5-5 4 3 7-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 6h5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 9h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24"><path d="m4 20 4.2-1 10.5-10.5a2.1 2.1 0 0 0-3-3L5.2 16Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m13.2 6.5 3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 4h4l1 3H9Zm-3 3 1 13h8M17 10l-1 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4M5 20h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 20V9m-4 4 4-4 4 4M5 4h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5Z"/><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3.1 1.3v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3.1-1.3l-.1.1a1.8 1.8 0 0 1-2.5-2.5l.1-.1A1.8 1.8 0 0 0 3.3 12a1.8 1.8 0 0 0 1.3-3.1l-.1-.1A1.8 1.8 0 0 1 7 6.3l.1.1A1.8 1.8 0 0 0 10.2 5v-.2a1.8 1.8 0 0 1 3.6 0V5a1.8 1.8 0 0 0 3.1 1.4l.1-.1a1.8 1.8 0 0 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 1.3 3.1 1.8 1.8 0 0 1 0 3.6 1.8 1.8 0 0 0-1.3 1.4Z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4.4 4.4L19 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="icon-alert" viewBox="0 0 24 24"><path d="m12 3 9 17H3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9v5M12 17h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="icon-cash" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12.5" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 9.5h.01M18 15.5h.01" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="icon-bank" viewBox="0 0 24 24"><path d="m3 9 9-5 9 5H3ZM5 11v7M9 11v7M15 11v7M19 11v7M3 20h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="icon-link" viewBox="0 0 24 24"><path d="m9 15 6-6M7 18H6a4 4 0 0 1 0-8h3M17 6h1a4 4 0 0 1 0 8h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="icon-transfer" viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="icon-food" viewBox="0 0 24 24"><path d="M6 3v8M4 3v5a2 2 0 0 0 4 0V3M6 10v11M16 3v18M16 3c3 2 3 7 0 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="icon-transport" viewBox="0 0 24 24"><path d="M5 16 6.5 7h11l1.5 9M4 16h16v3H4zM8 19v2M16 19v2M8 12h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="16" r="1"/><circle cx="16" cy="16" r="1"/></symbol>
      <symbol id="icon-shopping" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8a3 3 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="icon-house" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9H3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 20v-5h6v5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="icon-water" viewBox="0 0 24 24"><path d="M12 3s6 6.3 6 11a6 6 0 0 1-12 0c0-4.7 6-11 6-11Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 15a3 3 0 0 0 3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="icon-health" viewBox="0 0 24 24"><path d="M12 20s-8-4.8-8-10a4 4 0 0 1 8-1.5A4 4 0 0 1 20 10c0 5.2-8 10-8 10Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 11h2l1-2 2 4 1-2h2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="icon-fun" viewBox="0 0 24 24"><path d="M5 5h14v14H5z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m9 15 2-3 2 2 2-4 2 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="icon-study" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5A2.5 2.5 0 0 0 17.5 16H4Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 5v14.5A2.5 2.5 0 0 0 6.5 22H20M8 8h8M8 12h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="icon-gift" viewBox="0 0 24 24"><path d="M4 10h16v10H4zM3 7h18v3H3zM12 7v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 7H8.5a2 2 0 1 1 2-2c0 1.7 1.5 2 1.5 2ZM12 7h3.5a2 2 0 1 0-2-2c0 1.7-1.5 2-1.5 2Z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></symbol>
    </svg>

    <main class="app-shell">
      <section class="screen active" data-screen="home" aria-label="首页">
        <header class="hero home-hero">
          <div>
            <h1 id="homeGreeting">早上好</h1>
            <p class="page-date" id="homeDate"></p>
          </div>
        </header>

        <section class="summary-chart" aria-label="本月预算概览">
          <div class="summary-chart-head"><div><span>预算使用率</span><strong id="homeBudgetUsage">未设置</strong></div><button class="text-button" id="editBudget">设置每月预算</button></div>
          <div class="summary-chart-track" aria-hidden="true"><i class="summary-chart-segment expense-segment" id="homeExpenseBar"></i><i class="summary-chart-segment balance-segment" id="homeBalanceBar"></i></div>
          <div class="summary-legend"><div class="summary-legend-item"><span><i class="legend-dot expense-dot"></i>本月支出</span><strong id="homeExpense">¥0.00</strong></div><div class="summary-legend-item"><span><i class="legend-dot balance-dot"></i>本月预算结余</span><strong class="balance-text" id="homeBalance">—</strong></div></div>
        </section>

        <section class="section-block recent-section"><div class="section-heading"><h2>最近账目</h2><button class="text-button" id="viewAllRecords">查看全部</button></div><div id="homeRecent" class="entry-list"></div></section>
      </section>

      <section class="screen" data-screen="stats" aria-label="统计">
        <header class="hero compact-hero"><h1>支出统计</h1></header>
        <div class="month-switcher"><button class="icon-button" id="statsPrev" aria-label="上一个月"><svg><use href="#icon-chevron-left"/></svg></button><button class="month-label-button" id="statsMonth" type="button" aria-label="选择统计年月"></button><button class="icon-button" id="statsNext" aria-label="下一个月"><svg><use href="#icon-chevron-right"/></svg></button></div>
        <div class="period-tabs" role="tablist" aria-label="统计周期"><button class="active" data-period="month" role="tab">月</button><button data-period="quarter" role="tab">季</button><button data-period="year" role="tab">年</button></div>
        <section class="panel-section"><div class="section-heading"><h2>支出分类</h2><span class="section-note" id="statsTopCategory">暂无记录</span></div><article class="glass category-panel" id="categoryStats"></article></section>
        <section class="panel-section"><div class="section-heading"><h2 id="statsTrendTitle">每日支出趋势</h2><span class="section-note" id="statsTrendNote">当月趋势</span></div><article class="glass trend-panel"><div class="trend-chart" id="trendChart"></div><div class="trend-total" id="monthTrendTotal" hidden></div></article></section>
        <section class="settings-section data-management-section"><div class="section-heading"><h2>数据管理</h2></div><article class="settings-card glass"><button class="setting-row" id="exportData"><span class="setting-icon export"><svg><use href="#icon-download"/></svg></span><span><strong>导出 JSON</strong><small>备份当前设备上的全部账目</small></span><svg class="row-arrow"><use href="#icon-arrow-right"/></svg></button><label class="setting-row file-row"><span class="setting-icon import"><svg><use href="#icon-upload"/></svg></span><span><strong>导入 JSON</strong><small>从备份文件恢复账目</small></span><svg class="row-arrow"><use href="#icon-arrow-right"/></svg><input type="file" id="importData" accept="application/json,.json" /></label><button class="setting-row danger-row" id="clearData"><span class="setting-icon danger"><svg><use href="#icon-trash"/></svg></span><span><strong>清空本地数据</strong><small>删除当前设备保存的全部内容</small></span><svg class="row-arrow"><use href="#icon-arrow-right"/></svg></button></article></section>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航"><button class="nav-link active" data-nav="home"><svg><use href="#icon-home"/></svg><span>首页</span></button><button class="nav-action" id="addExpense" aria-label="记一笔支出"><span class="nav-action-icon"><svg><use href="#icon-plus"/></svg></span></button><button class="nav-link" data-nav="stats"><svg><use href="#icon-chart"/></svg><span>统计</span></button></nav>

    <dialog id="entryDialog" class="dialog"><form class="dialog-content entry-dialog" id="entryForm"><div class="dialog-title-row"><div><h2 id="entryDialogTitle">记一笔支出</h2></div></div><div class="entry-type-tabs"><button type="button" class="active" data-entry-type="expense">支出</button><button type="button" data-entry-type="transfer">转账</button></div><label class="amount-field"><span>金额</span><div><b>¥</b><input id="entryAmount" name="amount" inputmode="decimal" type="number" min="0.01" step="0.01" placeholder="0.00" required /></div></label><fieldset class="category-field"><legend>选择分类</legend><div id="categoryGrid" class="category-grid"></div></fieldset><div class="form-two-col"><label class="form-field"><span>日期</span><input id="entryDate" name="date" type="date" required /></label><label class="form-field"><span>支出方式</span><select id="entryAccount" name="accountId"></select></label></div><label class="form-field"><span>备注 <em>选填</em></span><input id="entryNote" name="note" maxlength="80" placeholder="例如：和朋友一起吃饭" /></label><p class="form-error" id="entryError" role="alert"></p><div class="dialog-actions"><button type="button" class="secondary-button" data-close="entryDialog">取消</button><button type="button" class="secondary-button" id="deleteEntry" hidden>删除</button><button class="primary-button" type="submit">保存账目</button></div></form></dialog>

    <dialog id="budgetDialog" class="dialog"><form class="dialog-content compact-dialog" id="budgetForm"><h2>每月给自己一个范围</h2><label class="amount-field budget-input"><span>月度预算</span><div><b>¥</b><input id="budgetAmount" type="number" min="0" step="0.01" placeholder="例如 5000" /></div></label><div class="dialog-actions"><button type="button" class="secondary-button" data-close="budgetDialog">取消</button><button class="primary-button" type="submit">保存预算</button></div></form></dialog>
    <dialog id="monthPickerDialog" class="dialog"><form class="dialog-content compact-dialog" id="monthPickerForm"><h2 id="periodPickerTitle">选择统计年月</h2><div class="form-two-col month-picker-fields"><label class="form-field"><span>年份</span><select id="monthPickerYear"></select></label><label class="form-field" id="monthPickerMonthField"><span>月份</span><select id="monthPickerMonth"></select></label><label class="form-field" id="monthPickerQuarterField" hidden><span>季度</span><select id="monthPickerQuarter"><option value="1">第一季度</option><option value="2">第二季度</option><option value="3">第三季度</option><option value="4">第四季度</select></label></div><button type="button" class="quick-period-button" id="returnToCurrentPeriod">回到当月</button><div class="dialog-actions"><button type="button" class="secondary-button" data-close="monthPickerDialog">取消</button><button class="primary-button" type="submit">查看统计</button></div></form></dialog>
    <dialog id="recordsDialog" class="dialog"><div class="dialog-content records-dialog"><p class="page-kicker">账目记录</p><h2>全部账目</h2><div class="records-filter"><label><span>时间</span><select id="recordTimeFilter"><option value="all">全部时间</option><option value="month">本月</option><option value="week">近 7 天</option><option value="today">今天</option></select></label><label><span>类别</span><select id="recordCategoryFilter"><option value="all">全部类别</option></select></label></div><div id="recordsDialogList" class="records-list"></div><button type="button" class="secondary-button records-close" data-close="recordsDialog">关闭</button></div></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
